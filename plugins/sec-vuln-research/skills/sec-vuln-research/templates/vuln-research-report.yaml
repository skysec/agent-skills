# ==============================================================================
# Security Vulnerability Research Report
# Generated by: sec-vuln-research skill
#
# Usage: fill every `null` field during the corresponding pipeline stage.
# Allowed values are noted inline as comments where the set is constrained.
# YAML is the single source of truth — never edit the rendered .md directly.
# Render to Markdown:
#   uv run {baseDir}/scripts/render_report.py <path-to-this-file.yaml>
# ==============================================================================

report:

  # ----------------------------------------------------------------------------
  # METADATA
  # ----------------------------------------------------------------------------
  metadata:
    repository: null          # URI or local path to the target codebase
    commit: null              # full git commit hash at assessment time
    date: null                # ISO 8601, e.g. "2026-05-15"
    session_id: null          # timestamp-based session ID, e.g. "2026-05-15T14:05:00Z"
    generated_by: "sec-vuln-research"
    skill_version: "2.1"
    config:
      mode: null              # full | diff
      base_ref: null          # git ref (diff mode only)
      head_ref: null          # git ref (diff mode only)
      depth: null             # quick | standard | deep
      budget_usd: null        # float, default 25.0 (0 = unlimited) — enforced by session_state.py
      triage_lenses: null     # integer lens count for critical/high (default 3: reachability, defenses, impact)
      severity_threshold: null  # critical | high | medium

  # ----------------------------------------------------------------------------
  # VERIFICATION  (COMPUTED by render_report.py — never fill by hand)
  # The renderer recomputes triage tallies from disk records and stamps this
  # block. A report whose YAML claims verification the records don't back is
  # refused finding-by-finding, and this block says so.
  # ----------------------------------------------------------------------------
  verification:
    status: null              # verified | unverified — computed, do not set
    reason: null
    findings_included: null
    findings_refused: null
    refused: []
    validation_warnings: []

  # ----------------------------------------------------------------------------
  # COVERAGE  (populated in Stage 0/1 from ingest_graph.json `coverage` + tiers)
  # A clean report must say what was examined, not leave it to assumption.
  # ----------------------------------------------------------------------------
  coverage:
    total_files: null         # every file under the target
    analyzed_files: null      # files in the graph (code files in supported languages)
    tier_c_skipped: null      # files ranked but not hunted (priority < 2.0)
    budget_truncated: []      # files that ranked >= Tier B but were cut by the budget stop
    by_top_level_dir: {}      # dir -> {total, analyzed} from ingest_graph.json
    skipped_dirs: {}          # dir -> {reason, file_count} (vendored, generated, ...)

  # ----------------------------------------------------------------------------
  # GRAPH ANALYSIS  (populated in Stage 0)
  # ----------------------------------------------------------------------------
  graph_analysis:
    backend: null             # trailmark | fallback-heuristic — if fallback, say so
                              # prominently in the summary narrative: taint and
                              # blast-radius data were unavailable for this run
    languages_detected: []    # e.g. [C, Python, Go]
    node_count: 0
    edge_count: 0
    files_analyzed: 0
    preanalysis_passes:
      - tainted               # always attempted
      - high_blast_radius
      - privilege_boundary
      - entrypoint_reachable

    attack_surface:           # from engine.attack_surface()
      - name: null            # function or endpoint name
        file: null            # relative file path
        line: null            # integer
        trust_level: null     # untrusted_external | semi_trusted_external | trusted_internal
        asset_value: null     # high | medium | low

    complexity_hotspots:      # top files by cyclomatic complexity
      - name: null
        file: null
        cyclomatic_complexity: null

  # ----------------------------------------------------------------------------
  # FILE RANKING  (populated in Stage 1 — top-ranked files only)
  # ----------------------------------------------------------------------------
  file_ranking:
    tier_a_count: 0           # files with priority >= 3.5
    tier_b_count: 0           # files with priority 2.0–3.5
    tier_c_count: 0           # files skipped (priority < 2.0)
    ranking_note: null        # e.g. "surface scored by LLM; influence and reachability from trailmark graph"

    top_files:                # Tier A files only, ordered by priority descending
      - path: null
        tier: null            # A | B
        priority: null        # float 1.0–5.0
        surface: null         # 1–5 (LLM-scored)
        influence: null       # 1–5 (from blast_radius_rank)
        reachability: null    # 1–5 (from entrypoint_distance)
        tainted: false
        high_blast_radius: false
        privilege_boundary: false

  # ----------------------------------------------------------------------------
  # EXECUTIVE SUMMARY  (populated in Stage 8)
  # ----------------------------------------------------------------------------
  summary:
    overall_risk: null        # Critical | High | Medium | Low
    narrative: null           # 3–5 sentences: what was found, highest-priority risks, key gaps

    risk_counts:
      total: 0
      critical: 0
      high: 0
      medium: 0
      low: 0
      triage_confirmed: 0
      triage_rejected: 0
      triage_uncertain: 0
      variants_surfaced: 0
      attack_chains_generated: 0

  # ----------------------------------------------------------------------------
  # RECOMMENDATIONS  (populated in Stage 8 — ordered by priority_score descending)
  # priority_score = (severity × 0.50) + (confidence × 0.25) + (attacker_position × 0.25)
  # See references/pipeline-stages.md §Stage 8 for score tables and tie-breaking rules.
  # ----------------------------------------------------------------------------
  recommendations:
    - rank: 1
      id: null                  # VULN-NNN
      title: null               # short title
      location: null            # file:line
      priority_score: null      # float computed per matrix in pipeline-stages.md §Stage 8
      severity: null            # final_severity after Stage 7 calibration
      attacker_position: null   # remote_unauth | remote_auth_low | remote_auth_elevated | local
      chained_with: null        # VULN-NNN of paired finding, or null
      description: null         # what to do and why it is the highest-priority item

  # ----------------------------------------------------------------------------
  # FINDINGS  (populated across Stages 3–7)
  # Each finding progresses through the evidence ladder as stages complete.
  # ----------------------------------------------------------------------------
  findings:
    - id: "VULN-001"
      stable_id: null         # content-derived, from scripts/finding_id.py — stays
                              # the same across scans while the code is unchanged;
                              # ci_gate.py gates on it. Stamp during Stage 3.

      # Stage 3 — Hunt data
      hunt:
        specialist: null      # memory_safety | auth_logic | injection | crypto_logic | subsystem
        file: null            # relative path, e.g. "net/parser.c"
        line_start: null      # integer
        line_end: null        # integer
        function: null        # function name containing the bug
        finding_type: null    # e.g. stack_buffer_overflow | sql_injection | auth_bypass
        cwe: null             # e.g. "CWE-122"
        severity: null        # critical | high | medium | low
        confidence: null      # high | medium | low
        description: null     # what is wrong at this location
        code_snippet: null    # the vulnerable lines verbatim
        taint_source: null    # where attacker-controlled data enters
        taint_sink: null      # where the bug manifests
        precondition: null    # what the attacker must control or know
        evidence_level: null  # suspicion | hunter_confirmed

        # Graph context from Stage 0 (populated automatically from ingest_graph.json)
        graph_context:
          tainted: false
          high_blast_radius: false
          privilege_boundary: false
          entrypoint_distance: null  # integer hops; 0 = IS an entry point
          entrypoint_path: null      # "recv_request → parse_header → parse_packet"

      # Stage 4 — Triage. The lens subagents write round records to
      # triage/rounds/<FINDING_ID>/; scripts/triage_tally.py COMPUTES this
      # block from those records and writes it here. Never fill the verdict,
      # confidence, or evidence level by hand — the renderer recomputes the
      # tally from disk and refuses findings whose claims don't match.
      triage:
        rounds: null          # record count (computed)
        verdicts: null        # one char per lens record, e.g. "VVI" (computed)
        lenses: null          # e.g. "R:V D:V I:I" — Reachability/Defenses/Impact (computed)
        arbiter_verdict: null # VALID | INVALID | UNCERTAIN (computed from arbiter record)
        confidence_score: null  # float 0.0–1.0 (computed: VALID votes / total records)
        low_confidence: false # computed: VALID with confidence < 0.6
        crux: null            # from the arbiter record
        triage_file: null     # relative path, e.g. "triage/T0001_parser_c_stack_overflow.md"
        final_evidence_level: null  # independently_verified | suspicion | uncertain (computed)

      # Stage 5 — Variant analysis
      variants: []            # list of variant-<uuid> IDs linked to this finding

      # Stage 6 — Attack chain (populated by sec-attack-chain, written back here)
      attack_chain:
        generated: false
        chain_file: null      # relative path, e.g. "attack-chains/VULN-001_parser_c.md"
        entry_point: null     # confirmed entry point function and file:line
        entry_point_source: null  # trailmark | grep
        exploit_path_summary: null  # one-sentence step-by-step summary
        poc_skeleton_available: false
        final_evidence_level: null  # root_cause_explained | exploit_demonstrated

        # Machine-readable validation plan — feeds validation-plan.json and the
        # SARIF codeFlow. A downstream validator (DAST tool, fuzzer, or a
        # sec-vuln-validate agent) consumes this and writes `result` back.
        validation:
          method: null        # dast | fuzz | script-poc | unit | manual
          interface: null     # http | network | cli | library | ipc | file
          entry_point:        # the reachable external interface (structured)
            symbol: null
            file: null
            line: null
            trust_level: null # untrusted_external | semi_trusted_external | trusted_internal
          path: []            # ["recv_request", "parse_header", "parse_packet"] — source→sink
          test_vector:
            parameter: null   # which input carries the trigger, e.g. "len field of packet header"
            input: null       # proposed triggering value/payload (NEVER a real secret)
            encoding: null     # raw | base64 | url | none
            constraints: null # e.g. "len > 64"
          oracle:
            type: null        # crash | asan | status-code | response-content | timing | side-effect | auth-state
            success: null     # observable signal that confirms exploitation
          request_template: null  # http/network only: raw request or OpenAPI fragment; mark partial if incomplete
          preconditions: []   # ["network reach to :PORT", "no auth"]
          # Written back by the validator — do not fill during discovery.
          result:
            status: unattempted  # confirmed | not_reproduced | inconclusive | unattempted
            validated_by: null   # tool or agent name
            validated_at: null   # ISO-8601
            evidence: null       # path to log/crash/response, or short note
          # A confirmed result with evidence promotes the finding to
          # exploit_demonstrated on the next render_report.py pass.

      # Stage 7 — Final state after dedup, chaining, calibration
      chained_with: null      # VULN-NNN if this finding was chained with another
      chaining_note: null     # e.g. "SSRF + auth bypass → data exfiltration"
      final_severity: null    # critical | high | medium | low (post-calibration)
      severity_calibration_note: null  # null if consistent, else explanation

  # ----------------------------------------------------------------------------
  # VARIANTS  (populated in Stage 5)
  # ----------------------------------------------------------------------------
  variants:
    - id: null                # variant-<uuid>
      parent_finding: null    # VULN-NNN this variant is related to
      file: null              # relative path
      line: null              # integer
      pattern_matched: null   # the grep/regex pattern that matched
      evidence_level: "suspicion"
      notes: null             # why this is worth human review

  # ----------------------------------------------------------------------------
  # PIPELINE  (populated throughout — final values written in Stage 8)
  # ----------------------------------------------------------------------------
  pipeline:
    total_duration_seconds: null
    total_cost_usd: null

    stages:
      graph_build:
        status: null          # completed | failed | skipped
        duration_seconds: null
        backend: null         # trailmark | fallback-heuristic
        files: null
        node_count: null
        edge_count: null

      dfd_generation:
        status: null
        duration_seconds: null
        output_file: null     # relative path to architecture-dfd.md

      diff_mode:
        status: null          # completed | skipped (null if mode=full)
        duration_seconds: null
        critical_findings_promoted: null  # integer

      ranking:
        status: null
        duration_seconds: null
        cost_usd: null
        note: null            # e.g. "surface only — influence and reachability from trailmark"

      context_generation:
        status: null
        duration_seconds: null
        cost_usd: null
        files_briefed: null

      hunting:
        status: null
        duration_seconds: null
        cost_usd: null
        raw_findings: null

      triage:
        status: null
        duration_seconds: null
        cost_usd: null
        valid: null
        rejected: null
        uncertain: null

      variant_analysis:
        status: null
        duration_seconds: null
        cost_usd: null
        variants: null

      attack_chains:
        status: null
        duration_seconds: null
        cost_usd: null
        generated: null
