      total_internal_entry_points: 0
      unauthenticated_entry_points:
        - component: code-assistant-agent
          entry_point_id: EP-001
          path_or_name: main (CLI)
      file_upload_endpoints: []
      admin_interfaces: []
      debug_endpoints: []

    security_observations_summary:
      - severity: critical
        observation: "HARDCODED API KEY: OpenAI API key hardcoded at agent.py:10 — CWE-798. Must be rotated immediately."
        component: code-assistant-agent
        element_ref: agent.py:10
        cwe: ["CWE-798"]
        recommendation: "Rotate key. Move to os.environ['OPENAI_API_KEY']. Scan git history."
      - severity: critical
        observation: "PROMPT INJECTION → RCE: user_context interpolated into system prompt via str.format() at agent.py:26. Attacker controls system prompt → model generates exec()/RUN: payload → code execution."
        component: code-assistant-agent
        element_ref: EP-001
        cwe: []
        recommendation: "Static system prompt only. Never use str.format() with user input on the system prompt."
      - severity: critical
        observation: "AUTO EXEC: LLM response auto-executed via exec() at agent.py:45 with full builtins — any prompt injection or model output manipulation leads to arbitrary code execution."
        component: code-assistant-agent
        element_ref: agent.py:45
        cwe: ["CWE-78"]
        recommendation: "Remove exec() on LLM output. Use a sandboxed execution environment with human confirmation."
      - severity: critical
        observation: "AUTO SHELL: LLM 'RUN: ' lines executed via subprocess.run(shell=True) at agent.py:53 — OS command injection from LLM output."
        component: code-assistant-agent
        element_ref: agent.py:53
        cwe: ["CWE-78"]
        recommendation: "Remove subprocess execution of LLM output. If needed, use an allowlist and require explicit confirmation."
      - severity: high
        observation: "NO AUTH BEFORE CONTRACTOR ROLLOUT: Agent has no authentication. All future contractors get full code/shell execution as the process OS user."
        component: code-assistant-agent
        element_ref: agent.py (comment)
        cwe: ["CWE-306"]
        recommendation: "Add authentication and per-identity authorization before any multi-user deployment."
      - severity: high
        observation: "API KEY LEAKAGE VIA EXCEPTIONS: agent.py:76 prints raw OpenAI exceptions which may contain API key fragments or request context."
        component: code-assistant-agent
        element_ref: agent.py:76
        cwe: ["CWE-209"]
        recommendation: "Catch specific exception types. Log stripped error codes only, never raw exception strings."

  open_questions:
    - id: Q-001
      question: "What OS user runs this agent, and what filesystem/network privileges does it have?"
      context: "exec() and subprocess.run(shell=True) at agent.py:45,53 execute with the full privileges of the running process. Impact scope depends on the OS user."
      component: code-assistant-agent
      impact_if_absent: critical
      answer: null
    - id: Q-002
      question: "Has the hardcoded OpenAI API key (agent.py:10) been rotated? Is it present in git history?"
      context: "OPENAI_API_KEY is a module-level literal. If this file was ever committed to version control, the key is in history permanently even after removal."
      component: code-assistant-agent
      impact_if_absent: critical
      answer: null
    - id: Q-003
      question: "Is there rate limiting or quota enforcement on OpenAI API calls before the contractor rollout?"
      context: "No max_tokens limit configured (agent.py:28-35 comment). Unbounded calls from multiple contractors could result in significant API cost abuse."
      component: code-assistant-agent
      impact_if_absent: high
      answer: null
    - id: Q-004
      question: "Are there outbound network restrictions on the host that would limit data exfiltration via exec() or subprocess?"
      context: "exec() with full builtins enables arbitrary network calls (urllib, requests, socket). Egress filtering is the only partial mitigating control."
      component: code-assistant-agent
      impact_if_absent: high
      answer: null
    - id: Q-005
      question: "What security hardening is planned before the 'next sprint' contractor rollout described in the code comments?"
      context: "Code comment explicitly mentions external contractor access. Current posture is unauthenticated full code/shell execution for any operator."
      component: code-assistant-agent
      impact_if_absent: critical
      answer: null

