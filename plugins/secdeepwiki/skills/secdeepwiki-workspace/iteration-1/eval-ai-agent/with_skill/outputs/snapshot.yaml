          - id: DF-002
            source: agent
            destination: openai-api
            data_description: System prompt + user messages → LLM response with embedded code/commands
            data_classification: internal
            protocol: HTTPS
            encryption_in_transit: tls
            authentication: api_key
            crosses_trust_boundary: true
            boundary_crossed: External API boundary
            security_observations:
