      entry_points:
        - id: EP-001
          type: cli_command
          path_or_name: main
          http_method: null
          authentication_required: no
          authorization_model: none
          input_validation:
            present: false
            framework: null
            schema_path: null
          rate_limited: false
          file_upload_accepted: false
          request_body_type: none
          source_file: agent.py
          line_number: 60
          security_observations:
            - observation: "user_context collected via input() and interpolated unescaped into system prompt via str.format() at agent.py:26. Attacker-controlled string reaches the system prompt directly — prompt injection leading to code execution."
              risk_signal: critical
              relevant_threats: ["prompt_injection", "indirect_prompt_injection"]
              cwe: []
              recommendation: "Use a static system prompt. Place user context in the user role with explicit delimiters. Never use str.format() with user input on the system prompt."
            - observation: "Every user_input turn passed to OpenAI as user message with no filtering. LLM response auto-executed via exec() (agent.py:45) and subprocess.run(shell=True) (agent.py:53). Indirect prompt injection from any content the agent is asked to review leads directly to code execution."
              risk_signal: critical
              relevant_threats: ["indirect_prompt_injection", "remote_code_execution"]
              cwe: ["CWE-78"]
              recommendation: "Remove exec() and subprocess.run() on LLM output. Use a sandboxed code-execution API if execution capability is required. Add human confirmation before any execution."
            - observation: "No authentication before contractor rollout (noted in comment). Any operator of the script will have full code/shell execution as the OS user running the process."
              risk_signal: high
              relevant_threats: ["missing_authentication"]
              cwe: ["CWE-306"]
              recommendation: "Add identity verification and per-user authorization before any multi-user rollout."

