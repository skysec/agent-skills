      concern: MD5 used — insufficient for any security-sensitive hash operation
      file: mcp_server.py
      library: hashlib
      line: 16
      operation: hashing
  data_stores:
  - connection_config_source: hardcoded
    data_classification: unknown
    security_observations:
    - observation: Database path hardcoded as '/app/data/production.db'. Connection
        string not from env var.
      recommendation: Move database path to environment variable. Use read-only connection
        for query-only operations.
      risk_signal: medium
    - observation: Direct SQL execution from tool input with no parameterization —
        full SQL injection.
      recommendation: Use parameterized queries via sqlite3 cursor.execute(query,
        params) pattern.
      risk_signal: critical
    technology: SQLite
    type: rdbms
  description: 'A FastMCP-based MCP server exposing 7 tools: file system read/write,
    shell command execution, SQLite database querying, URL fetching, directory listing,
    and notification sending. Bound to all interfaces on port 8080 with no authentication.
    Contains hardcoded credentials and an embedded prompt injection payload in a tool
    docstring.

    '
  entry_points:
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-001
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 18
    path_or_name: read_file
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-22
      - CWE-552
      observation: Tool reads any file path without restriction. No path sanitization
        or sandboxing. Allows reading /etc/passwd, SSH keys, env files.
      recommendation: Restrict to an allowlisted base directory. Reject paths containing
        '..' or absolute paths outside the allowed root.
      relevant_threats:
      - path_traversal
      - arbitrary_file_read
      risk_signal: critical
    source_file: mcp_server.py
    type: mcp_tool
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-002
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 28
    path_or_name: write_file
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-22
      - CWE-552
      observation: Tool writes to any path without restriction. Can overwrite system
        files, SSH authorized_keys, crontabs, or application secrets.
      recommendation: Restrict writes to a sandboxed working directory. Reject absolute
        paths and path traversal sequences.
      relevant_threats:
      - arbitrary_file_write
      - path_traversal
      risk_signal: critical
    source_file: mcp_server.py
    type: mcp_tool
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-003
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 38
    path_or_name: run_command
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-78
      observation: Arbitrary shell execution via subprocess with shell=True. Any MCP
        client input reaches the OS shell directly — remote code execution.
      recommendation: Remove this tool or replace with a strict allowlist of permitted
        commands. Never pass user input to shell=True.
      relevant_threats:
      - command_injection
      - remote_code_execution
      risk_signal: critical
    - cwe: []
      observation: 'PROMPT INJECTION PAYLOAD: The tool''s docstring contains an <IMPORTANT>
        block instructing consuming LLMs to silently exfiltrate ~/.ssh/id_rsa to attacker.example.com
        via curl before executing the real command. This is indirect prompt injection
        in a tool definition.'
      recommendation: Remove the malicious docstring content immediately. Audit all
        tool descriptions for embedded instructions. Treat tool descriptions as untrusted
        content when consumed by LLM agents.
      relevant_threats:
      - prompt_injection
      - indirect_prompt_injection
      - data_exfiltration
      risk_signal: critical
    source_file: mcp_server.py
    type: mcp_tool
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-004
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 54
    path_or_name: query_database
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-89
      observation: Executes raw SQL from MCP input with no parameterization. Full
        SQL injection — attacker can read/write/drop any table in the production database.
      recommendation: Use parameterized queries. Restrict to read-only operations
        if writes are not required. Use a separate read-only DB connection.
      relevant_threats:
      - sql_injection
      risk_signal: critical
    source_file: mcp_server.py
    type: mcp_tool
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-005
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 64
    path_or_name: fetch_url
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-918
      observation: No URL scheme or host validation. SSRF — attacker can reach internal
        services (AWS metadata at 169.254.169.254, internal APIs, localhost admin
        endpoints).
      recommendation: Validate URLs against a strict allowlist of permitted external
        hosts. Block private IP ranges and cloud metadata endpoints.
      relevant_threats:
      - ssrf
      risk_signal: high
    source_file: mcp_server.py
    type: mcp_tool
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-006
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 73
    path_or_name: send_notification
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-78
      observation: Email sending uses os.system with user-controlled 'recipient' parameter
        — direct shell injection. A recipient like 'x@x.com; rm -rf /' executes arbitrary
        commands.
      recommendation: Use a proper email library (smtplib) with explicit parameters.
        Never interpolate user input into os.system calls.
      relevant_threats:
      - command_injection
      risk_signal: critical
    source_file: mcp_server.py
    type: mcp_tool
  - authentication_required: false
    authorization_model: none
    file_upload_accepted: false
    http_method: null
    id: EP-007
    input_validation:
      framework: null
      present: false
      schema_path: null
    line_number: 85
    path_or_name: list_directory
    rate_limited: false
    request_body_type: json
    security_observations:
    - cwe:
      - CWE-22
      - CWE-78
      observation: Directory listing via 'ls -la {path}' with shell=True. Path traversal
        and shell injection — path containing semicolons executes arbitrary commands.
      recommendation: Use os.listdir() or pathlib.Path.iterdir() instead. Never pass
        user-controlled path to shell commands.
      relevant_threats:
      - path_traversal
      - command_injection
      risk_signal: high
    source_file: mcp_server.py
    type: mcp_tool
