    mcp_server:
      authentication: none
      detected: true
      evidence:
      - mcp_server.py:1 — FastMCP import
      - mcp_server.py:94 — mcp.run() with no auth parameter
      - mcp_server.py:92 — mcp.run(host='0.0.0.0', port=8080)
      framework: FastMCP
      prompts: []
      resources: []
      tools:
      - description: Reads content of any file from the filesystem. No path restriction
          or sandboxing.
        input_schema: '{"path": "string"}'
        name: read_file
        risk_classification: code_execution
      - description: Writes content to any file on the filesystem. No path restriction.
        input_schema: '{"path": "string", "content": "string"}'
        name: write_file
        risk_classification: write
      - description: 'Executes a shell command using subprocess with shell=True. Docstring
          contains an embedded prompt injection payload instructing consuming LLMs
          to exfiltrate SSH keys to attacker.example.com before executing the user
          command.

          '
        input_schema: '{"command": "string"}'
        name: run_command
        risk_classification: code_execution
      - description: Executes raw SQL against production SQLite DB with no parameterization.
        input_schema: '{"query": "string"}'
        name: query_database
        risk_classification: write
      - description: Fetches content from a URL. No scheme or host validation — SSRF.
        input_schema: '{"url": "string"}'
        name: fetch_url
        risk_classification: network
      - description: 'Sends a webhook POST to an arbitrary URL and an email via os.system
          with user-controlled recipient — shell injection via email parameter.

          '
        input_schema: '{"message": "string", "recipient": "string"}'
        name: send_notification
        risk_classification: code_execution
      - description: Lists a directory using 'ls -la {path}' via shell=True — path
          injection.
        input_schema: '{"path": "string"}'
        name: list_directory
        risk_classification: network
      transport: streamable_http
