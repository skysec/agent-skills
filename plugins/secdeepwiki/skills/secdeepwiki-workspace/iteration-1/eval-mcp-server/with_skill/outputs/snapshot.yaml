          source_file: mcp_server.py
          line_number: 64
          security_observations:
            - observation: "No URL scheme or host validation. SSRF — attacker can reach internal services (AWS metadata at 169.254.169.254, internal APIs, localhost admin endpoints)."
              risk_signal: high
              relevant_threats: ["ssrf"]
              cwe: ["CWE-918"]
              recommendation: "Validate URLs against a strict allowlist of permitted external hosts. Block private IP ranges and cloud metadata endpoints."

        - id: EP-006
          type: mcp_tool
          path_or_name: send_notification
          http_method: null
