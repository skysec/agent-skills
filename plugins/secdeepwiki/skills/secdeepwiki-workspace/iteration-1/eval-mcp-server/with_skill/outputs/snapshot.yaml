            - observation: "Email sending uses os.system with user-controlled 'recipient' parameter — direct shell injection. A recipient like 'x@x.com; rm -rf /' executes arbitrary commands."
              risk_signal: critical
              relevant_threats: ["command_injection"]
              cwe: ["CWE-78"]
              recommendation: "Use a proper email library (smtplib) with explicit parameters. Never interpolate user input into os.system calls."

        - id: EP-007
