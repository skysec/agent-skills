              risk_signal: high
              relevant_threats: ["path_traversal", "command_injection"]
              cwe: ["CWE-22", "CWE-78"]
              recommendation: "Use os.listdir() or pathlib.Path.iterdir() instead. Never pass user-controlled path to shell commands."

