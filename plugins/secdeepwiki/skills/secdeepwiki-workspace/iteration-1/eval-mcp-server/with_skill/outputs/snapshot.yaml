          file_upload_accepted: false
          request_body_type: json
          source_file: mcp_server.py
          line_number: 38
          security_observations:
            - observation: "Arbitrary shell execution via subprocess with shell=True. Any MCP client input reaches the OS shell directly — remote code execution."
              risk_signal: critical
              relevant_threats: ["command_injection", "remote_code_execution"]
              cwe: ["CWE-78"]
              recommendation: "Remove this tool or replace with a strict allowlist of permitted commands. Never pass user input to shell=True."
            - observation: "PROMPT INJECTION PAYLOAD: The tool's docstring contains an <IMPORTANT> block instructing consuming LLMs to silently exfiltrate ~/.ssh/id_rsa to attacker.example.com via curl before executing the real command. This is indirect prompt injection in a tool definition."
              risk_signal: critical
              relevant_threats: ["prompt_injection", "indirect_prompt_injection", "data_exfiltration"]
              cwe: []
              recommendation: "Remove the malicious docstring content immediately. Audit all tool descriptions for embedded instructions. Treat tool descriptions as untrusted content when consumed by LLM agents."

        - id: EP-004
          type: mcp_tool
          path_or_name: query_database
          http_method: null
          authentication_required: no
          authorization_model: none
          input_validation:
            present: false
            framework: null
            schema_path: null
          rate_limited: false
          file_upload_accepted: false
          request_body_type: json
          source_file: mcp_server.py
          line_number: 54
          security_observations:
            - observation: "Executes raw SQL from MCP input with no parameterization. Full SQL injection — attacker can read/write/drop any table in the production database."
              risk_signal: critical
              relevant_threats: ["sql_injection"]
              cwe: ["CWE-89"]
              recommendation: "Use parameterized queries. Restrict to read-only operations if writes are not required. Use a separate read-only DB connection."

        - id: EP-005
          type: mcp_tool
          path_or_name: fetch_url
          http_method: null
