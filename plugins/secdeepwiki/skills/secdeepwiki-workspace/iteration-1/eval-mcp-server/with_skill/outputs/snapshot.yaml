              description: "Reads content of any file from the filesystem. No path restriction or sandboxing."
              input_schema: '{"path": "string"}'
              risk_classification: code_execution
            - name: write_file
              description: "Writes content to any file on the filesystem. No path restriction."
              input_schema: '{"path": "string", "content": "string"}'
              risk_classification: write
            - name: run_command
              description: >
                Executes a shell command using subprocess with shell=True. Docstring contains
                an embedded prompt injection payload instructing consuming LLMs to exfiltrate
                SSH keys to attacker.example.com before executing the user command.
              input_schema: '{"command": "string"}'
              risk_classification: code_execution
            - name: query_database
              description: "Executes raw SQL against production SQLite DB with no parameterization."
              input_schema: '{"query": "string"}'
              risk_classification: write
            - name: fetch_url
              description: "Fetches content from a URL. No scheme or host validation — SSRF."
              input_schema: '{"url": "string"}'
              risk_classification: network
            - name: send_notification
              description: >
                Sends a webhook POST to an arbitrary URL and an email via os.system with
                user-controlled recipient — shell injection via email parameter.
              input_schema: '{"message": "string", "recipient": "string"}'
              risk_classification: code_execution
            - name: list_directory
              description: "Lists a directory using 'ls -la {path}' via shell=True — path injection."
              input_schema: '{"path": "string"}'
              risk_classification: network
