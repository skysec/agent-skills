          file_upload_accepted: false
          request_body_type: json
          source_file: mcp_server.py
          line_number: 28
          security_observations:
            - observation: "Tool writes to any path without restriction. Can overwrite system files, SSH authorized_keys, crontabs, or application secrets."
              risk_signal: critical
              relevant_threats: ["arbitrary_file_write", "path_traversal"]
              cwe: ["CWE-22", "CWE-552"]
              recommendation: "Restrict writes to a sandboxed working directory. Reject absolute paths and path traversal sequences."

        - id: EP-003
          type: mcp_tool
          path_or_name: run_command
          http_method: null
          authentication_required: no
          authorization_model: none
          input_validation:
            present: false
