          line_number: 18
          security_observations:
            - observation: "Tool reads any file path without restriction. No path sanitization or sandboxing. Allows reading /etc/passwd, SSH keys, env files."
              risk_signal: critical
              relevant_threats: ["path_traversal", "arbitrary_file_read"]
              cwe: ["CWE-22", "CWE-552"]
              recommendation: "Restrict to an allowlisted base directory. Reject paths containing '..' or absolute paths outside the allowed root."

        - id: EP-002
          type: mcp_tool
          path_or_name: write_file
          http_method: null
          authentication_required: no
          authorization_model: none
          input_validation:
            present: false
