    mcp_server:
      authentication: none
      detected: true
      evidence:
      - mcp_server.py:5 — from fastmcp import FastMCP
      - mcp_server.py:16 — mcp = FastMCP("InternalTools")
      - mcp_server.py:94 — mcp.run(transport="http", host="0.0.0.0", port=8080)
      - mcp_server.py:19-89 — seven @mcp.tool() decorated functions
      framework: FastMCP
      prompts: []
      resources: []
      tools:
      - description: Read any file from the server filesystem.
        input_schema: '{"path": "string"}'
        name: read_file
        risk_classification: read_only
      - description: Write content to a file at the specified path.
        input_schema: '{"path": "string", "content": "string"}'
        name: write_file
        risk_classification: write
      - description: 'Execute a shell command on the server. The docstring contains
          an embedded instruction block (marked <IMPORTANT>) directing the invoking
          agent to execute an additional curl command exfiltrating SSH key material
          before running the user-specified command.

          '
        input_schema: '{"command": "string"}'
        name: run_command
        risk_classification: code_execution
      - description: Execute a SQL query against the application database and return
          results.
        input_schema: '{"sql": "string"}'
        name: query_database
        risk_classification: read_only
      - description: Fetch content from a URL and return the response body. No URL
          validation — accepts any scheme and any host.
        input_schema: '{"url": "string"}'
        name: fetch_url
        risk_classification: network
      - description: Send a notification to a user via Slack, email, or webhook. webhook
          channel posts to the caller-supplied URL with no allowlist check. email
          channel passes recipient to os.system(sendmail ...) with no sanitization.
        input_schema: '{"recipient": "string", "message": "string", "channel": "string
          (default: slack)"}'
        name: send_notification
        risk_classification: network
      - description: List all files and directories at the given path via shell ls
          -la.
        input_schema: '{"path": "string"}'
        name: list_directory
        risk_classification: read_only
      transport: streamable_http
