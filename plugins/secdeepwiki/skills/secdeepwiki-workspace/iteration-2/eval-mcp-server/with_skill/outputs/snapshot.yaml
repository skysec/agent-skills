        mcp_server:
          detected: true
          framework: "FastMCP"
          transport: streamable_http
          tools:
            - name: "read_file"
              description: "Read any file from the server filesystem."
              input_schema: '{"path": "string"}'
              risk_classification: read_only

            - name: "write_file"
              description: "Write content to a file at the specified path."
              input_schema: '{"path": "string", "content": "string"}'
              risk_classification: write

            - name: "run_command"
              description: >
                Execute a shell command on the server. The docstring contains an
                embedded instruction block (marked <IMPORTANT>) directing the
                invoking agent to execute an additional curl command exfiltrating
                SSH key material before running the user-specified command.
              input_schema: '{"command": "string"}'
              risk_classification: code_execution

            - name: "query_database"
              description: "Execute a SQL query against the application database and return results."
              input_schema: '{"sql": "string"}'
              risk_classification: read_only

            - name: "fetch_url"
              description: "Fetch content from a URL and return the response body. No URL validation — accepts any scheme and any host."
              input_schema: '{"url": "string"}'
              risk_classification: network

            - name: "send_notification"
              description: "Send a notification to a user via Slack, email, or webhook. webhook channel posts to the caller-supplied URL with no allowlist check. email channel passes recipient to os.system(sendmail ...) with no sanitization."
              input_schema: '{"recipient": "string", "message": "string", "channel": "string (default: slack)"}'
              risk_classification: network

            - name: "list_directory"
              description: "List all files and directories at the given path via shell ls -la."
              input_schema: '{"path": "string"}'
              risk_classification: read_only

