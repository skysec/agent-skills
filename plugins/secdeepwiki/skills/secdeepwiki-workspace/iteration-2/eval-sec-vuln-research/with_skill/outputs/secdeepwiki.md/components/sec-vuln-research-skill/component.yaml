  confidence:
    limitations:
    - 'The skill''s primary runtime surface is SKILL.md (natural-language instructions
      read by a Claude agent). That surface is opaque to static analysis — what the
      agent does at runtime (file reads, grep calls, trailmark API calls) is not statically
      traceable.

      '
    - 'trailmark is an optional runtime dependency. Its API (CodeGraph, preanalysis(),
      attack_surface(), etc.) is called but not present in this repo; behavior of
      the trailmark-dependent code paths cannot be verified from this snapshot alone.

      '
