        The agent sends user messages to the OpenAI Chat Completions API (model: gpt-4o), then
        autonomously executes any Python code blocks or shell commands that appear verbatim in
        the LLM response. Source comment notes the agent is being extended to serve external
        contractors in a future sprint.
