        mermaid: |
          graph LR
            User([Interactive User\nunauthenticated]) -->|stdin: user_context + user_input| Agent[/Code Assistant Agent\nPython • local process/]
            Agent -->|HTTPS + API key\nChat Completions request| OpenAI([OpenAI API\ngpt-4o])
            OpenAI -->|HTTPS\nassistant reply may contain code + shell commands| Agent
            Agent -->|exec Python / subprocess shell=True| Host([Host OS])
            Agent -->|stdout: reply + command output| User

      - level: component
        actors:
          - id: A-USER
            name: Interactive User
            type: external_user
            trust_level: untrusted

          - id: A-OPENAI
            name: OpenAI API
            type: third_party_service
            trust_level: partially_trusted

          - id: A-HOST
            name: Host OS
            type: system
            trust_level: highly_trusted

        processes:
          - id: P-CHAT-LOOP
            name: "chat_loop()"
            component_ref: code-assistant-agent
            trust_zone: local_process
            technology: Python

          - id: P-RUN-TASK
            name: "run_agent_task()"
            component_ref: code-assistant-agent
            trust_zone: local_process
            technology: Python / openai SDK

          - id: P-EXEC
            name: "exec() + subprocess.run()"
            component_ref: code-assistant-agent
            trust_zone: local_process
            technology: Python builtins + OS shell

        data_stores: []

        data_flows:
          - id: DF-C-001
            source: A-USER
            destination: P-CHAT-LOOP
            data_description: "user_context (stdin, once per session) and user_input (stdin, each turn)"
            data_classification: internal
            protocol: stdin
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: false
            boundary_crossed: null

          - id: DF-C-002
            source: P-CHAT-LOOP
            destination: P-RUN-TASK
            data_description: "user_input and user_context passed as function arguments"
            data_classification: internal
            protocol: in-process
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: false
            boundary_crossed: null

          - id: DF-C-003
            source: P-RUN-TASK
            destination: A-OPENAI
            data_description: >
              POST /v1/chat/completions — system prompt contains user_context injected via
              str.format(); user message contains raw user_input. No max_tokens limit set.
            data_classification: internal
            protocol: HTTPS
            encryption_in_transit: tls
            authentication: api_key
            crosses_trust_boundary: true
            boundary_crossed: "local_process → OpenAI third-party"

          - id: DF-C-004
            source: A-OPENAI
            destination: P-RUN-TASK
            data_description: >
              LLM reply text. Parsed for ```python code blocks (→ exec()) and
              "RUN: " prefixed lines (→ subprocess.run(shell=True)).
            data_classification: internal
            protocol: HTTPS
            encryption_in_transit: tls
            authentication: none
            crosses_trust_boundary: true
            boundary_crossed: "OpenAI third-party → local_process"

          - id: DF-C-005
            source: P-RUN-TASK
            destination: P-EXEC
            data_description: >
              Extracted code string (from LLM reply) passed to exec();
              extracted shell command string (from LLM reply) passed to subprocess.run(shell=True).
            data_classification: internal
            protocol: in-process
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: false
            boundary_crossed: null

          - id: DF-C-006
            source: P-EXEC
            destination: A-HOST
            data_description: >
              Python bytecode executed in the agent process with full builtins scope;
              shell commands forwarded to /bin/sh via subprocess.run(shell=True).
            data_classification: internal
            protocol: OS syscall
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: true
            boundary_crossed: "agent process → host OS"

        trust_boundaries:
          - id: TB-001
            name: Agent Process Boundary
            type: process
            contains:
              - P-CHAT-LOOP
              - P-RUN-TASK
              - P-EXEC

          - id: TB-002
            name: OpenAI Third-Party Boundary
            type: third_party
            contains:
              - A-OPENAI

          - id: TB-003
            name: Host OS Boundary
            type: machine
            contains:
              - A-HOST

        mermaid: |
          sequenceDiagram
            participant User as Interactive User
            participant ChatLoop as chat_loop()
            participant RunTask as run_agent_task()
            participant OpenAI as OpenAI API (gpt-4o)
            participant Exec as exec() / subprocess.run()
            participant Host as Host OS

            User->>ChatLoop: user_context (stdin, once)
            loop while input != quit
              User->>ChatLoop: user_input (stdin)
              ChatLoop->>RunTask: user_input, user_context
              RunTask->>OpenAI: POST /v1/chat/completions\nsystem[user_context injected] + user[user_input]
              OpenAI-->>RunTask: assistant reply text
              alt reply contains ```python block
                RunTask->>Exec: exec(code_block, builtins)
                Exec->>Host: execute Python in-process
                Host-->>Exec: (side effects)
              end
              alt reply contains RUN: line
                RunTask->>Exec: subprocess.run(cmd, shell=True)
                Exec->>Host: /bin/sh -c cmd
                Host-->>Exec: stdout/stderr
                Exec-->>RunTask: appended to reply
              end
              RunTask-->>ChatLoop: reply string
              ChatLoop-->>User: print to stdout
            end

    attack_surface:
      total_external_entry_points: 2
      total_internal_entry_points: 1
      unauthenticated_entry_points:
        - component: code-assistant-agent
          entry_point_id: EP-001
          path_or_name: chat_loop
        - component: code-assistant-agent
          entry_point_id: EP-002
          path_or_name: "run_agent_task — user_input parameter"
        - component: code-assistant-agent
          entry_point_id: EP-003
          path_or_name: "run_agent_task — user_context parameter"
      file_upload_endpoints: []
      admin_interfaces: []
      debug_endpoints: []

