            trust_zone: local_process
            technology: Python / openai SDK

        data_stores: []

        data_flows:
          - id: DF-001
            source: A-USER
            destination: P-AGENT
            data_description: >
              user_context string (role/context entered once per session) and user_input
              (freeform task message entered each turn), both read from stdin.
            data_classification: internal
            protocol: stdin
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: false
            boundary_crossed: null

          - id: DF-002
            source: P-AGENT
            destination: A-OPENAI
            data_description: >
              Chat Completions API request containing the rendered system prompt
              (SYSTEM_TEMPLATE with user_context injected) and the user_input as the
              user message. Transmitted over HTTPS using the openai SDK.
            data_classification: internal
            protocol: HTTPS
            encryption_in_transit: tls
            authentication: api_key
            crosses_trust_boundary: true
            boundary_crossed: "local_process → third_party_service (OpenAI)"

          - id: DF-003
            source: A-OPENAI
            destination: P-AGENT
            data_description: >
              Chat Completions API response containing the assistant reply text. This
              text is parsed by the agent for executable content: triple-backtick python
              fences are passed to exec(); lines prefixed with "RUN: " are passed to
              subprocess.run(shell=True).
            data_classification: internal
            protocol: HTTPS
            encryption_in_transit: tls
            authentication: none
            crosses_trust_boundary: true
            boundary_crossed: "third_party_service (OpenAI) → local_process"

          - id: DF-004
            source: P-AGENT
            destination: A-HOST
            data_description: >
              Python code strings passed to exec() run inside the current process with
              full builtins. Shell command strings passed to subprocess.run(shell=True)
              invoke /bin/sh on the host.
            data_classification: internal
            protocol: OS syscall
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: true
            boundary_crossed: "agent process → host OS"

          - id: DF-005
            source: P-AGENT
            destination: A-USER
            data_description: >
              Assistant reply and any appended subprocess stdout printed to terminal.
              On unhandled exception, Python exception text (which may include API key
              context) is printed via print(f"Error: {e}").
            data_classification: internal
            protocol: stdout
            encryption_in_transit: none
            authentication: none
            crosses_trust_boundary: false
            boundary_crossed: null

        trust_boundaries:
          - id: TB-001
            name: Agent Process Boundary
            type: process
            contains:
