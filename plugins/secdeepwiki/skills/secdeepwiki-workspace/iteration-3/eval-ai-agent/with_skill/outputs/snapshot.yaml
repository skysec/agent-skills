              model_id: gpt-4o
              api_key_source: hardcoded
          tools_defined:
            - name: python_code_exec
              description: >
                Executes Python code blocks extracted from the LLM response using exec().
                Code is parsed from triple-backtick python fences in the assistant reply and
                passed to exec() with the full process builtins in scope.
              risk_surface: code_exec
            - name: shell_command_exec
              description: >
                Executes shell commands extracted from the LLM response using
                subprocess.run() with shell=True. Commands are identified by the literal
                prefix "RUN: " in the assistant reply text.
              risk_surface: code_exec
          rag_detected: false
          memory_mechanism: none
          guardrails_present: false
          evidence:
            - "agent.py:5 — import openai"
            - "agent.py:11 — client = openai.OpenAI(api_key=OPENAI_API_KEY)"
            - "agent.py:29 — model='gpt-4o'"
            - "agent.py:45 — exec(code, {'__builtins__': __builtins__})"
            - "agent.py:53 — subprocess.run(cmd, shell=True, capture_output=True, text=True)"

