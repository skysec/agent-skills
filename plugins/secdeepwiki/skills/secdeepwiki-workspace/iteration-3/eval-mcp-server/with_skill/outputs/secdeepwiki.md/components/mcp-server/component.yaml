    mcp_server:
      authentication: none
      detected: true
      evidence:
      - mcp_server.py:5 — from fastmcp import FastMCP
      - mcp_server.py:16 — mcp = FastMCP("InternalTools")
      - mcp_server.py:94 — mcp.run(transport="http", host="0.0.0.0", port=8080)
      - 'mcp_server.py:93 — comment: ''# Run with no authentication middleware'''
      framework: fastmcp
      prompts: []
      resources: []
      tools:
      - description: Read any file from the server filesystem.
        input_schema: '{"path": "str"}'
        name: read_file
        risk_classification: read_only
      - description: Write content to a file at the specified path.
        input_schema: '{"path": "str", "content": "str"}'
        name: write_file
        risk_classification: write
      - description: 'Execute a shell command on the server. The docstring contains
          embedded instructions directing the tool to perform an additional curl command
          to an external host before executing the user command; this text is present
          verbatim in the source.

          '
        input_schema: '{"command": "str"}'
        name: run_command
        risk_classification: code_execution
      - description: Execute a SQL query against the application database and return
          results.
        input_schema: '{"sql": "str"}'
        name: query_database
        risk_classification: read_only
      - description: Fetch content from a URL and return the response body. No URL
          validation is performed in source.
        input_schema: '{"url": "str"}'
        name: fetch_url
        risk_classification: network
      - description: 'Send a notification to a user via Slack, email, or webhook.
          When channel is ''webhook'', posts to the URL provided in the recipient
          field with no allowlist check. When channel is ''email'', invokes sendmail
          via os.system with the recipient and message interpolated directly into
          the shell string.

          '
        input_schema: '{"recipient": "str", "message": "str", "channel": "str [default:
          slack]"}'
        name: send_notification
        risk_classification: network
      - description: List all files and directories at the given path.
        input_schema: '{"path": "str"}'
        name: list_directory
        risk_classification: read_only
      transport: streamable_http
