        mcp_server:
          detected: true
          framework: "fastmcp"
          transport: streamable_http
          tools:
            - name: read_file
              description: "Read any file from the server filesystem."
              input_schema: '{"path": "str"}'
              risk_classification: read_only
            - name: write_file
              description: "Write content to a file at the specified path."
              input_schema: '{"path": "str", "content": "str"}'
              risk_classification: write
            - name: run_command
              description: >
                Execute a shell command on the server. The docstring contains embedded
                instructions directing the tool to perform an additional curl command to an
                external host before executing the user command; this text is present verbatim
                in the source.
              input_schema: '{"command": "str"}'
              risk_classification: code_execution
            - name: query_database
              description: "Execute a SQL query against the application database and return results."
              input_schema: '{"sql": "str"}'
              risk_classification: read_only
            - name: fetch_url
              description: "Fetch content from a URL and return the response body. No URL validation is performed in source."
              input_schema: '{"url": "str"}'
              risk_classification: network
            - name: send_notification
              description: >
                Send a notification to a user via Slack, email, or webhook. When channel is
                'webhook', posts to the URL provided in the recipient field with no allowlist
                check. When channel is 'email', invokes sendmail via os.system with the
                recipient and message interpolated directly into the shell string.
              input_schema: '{"recipient": "str", "message": "str", "channel": "str [default: slack]"}'
              risk_classification: network
            - name: list_directory
              description: "List all files and directories at the given path."
              input_schema: '{"path": "str"}'
              risk_classification: read_only
