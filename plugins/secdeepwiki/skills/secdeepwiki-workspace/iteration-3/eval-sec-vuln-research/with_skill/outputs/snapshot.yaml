    - id: sec-attack-chain-skill
      name: "sec-attack-chain Skill"
      path: "skills/sec-attack-chain"
      description: >
        Generates structured attack chain documents for confirmed security vulnerabilities.
        Traces the real entry point backward through the call graph (using trailmark graph
        data when available, grep-based tracing as fallback), documents exploitation steps,
        assesses severity on four dimensions, and writes a functional PoC skeleton. Produces
        a Markdown attack chain document and populates the attack_chain block in the YAML
        report. Contains SKILL.md and an attack chain Markdown template; no executable scripts.
      owner: null

      analysis_provenance:
        source: fresh_analysis
        from_snapshot_id: null
        from_commit_sha: null
