          backend_framework: null
          evidence: []

        api_service:
          detected: false
          style: null
          framework: null
          spec_file:
            present: false
            format: null
            path: null
          evidence: []

        ai_agent:
          detected: true
          framework: custom
          models_referenced:
            - provider: anthropic
              model_id: null
              api_key_source: null
          tools_defined:
            - name: read_file
              description: "Read the full function containing the vulnerability and surrounding context"
              risk_surface: file_access
            - name: trace_callers
              description: "Walk backward from the vulnerable function to find public entry points"
              risk_surface: file_access
            - name: resolve_symbol
              description: "Resolve named constants (buffer sizes, limits) to numeric values"
              risk_surface: file_access
            - name: engine_entrypoint_paths_to
              description: "Use trailmark graph to enumerate all paths from attack surface to vulnerable function"
              risk_surface: file_access
          rag_detected: false
          memory_mechanism: file_system   # writes attack-chains/VULN-NNN_<slug>.md per finding
          guardrails_present: true
          evidence:
