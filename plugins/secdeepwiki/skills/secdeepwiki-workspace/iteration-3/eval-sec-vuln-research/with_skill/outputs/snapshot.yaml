        eight stages (graph build via trailmark, file ranking, context generation, four
        specialist hunters, adversarial triage, variant analysis, attack chain generation,
        and report production). Contains the analyze.py ingest script, render_report.py
        renderer, a Jinja2 report template, and a YAML report template. This is the primary
        entry point for the plugin's vulnerability-finding capability.
