              description: "Read source file content at a given path"
              risk_surface: file_access
            - name: search_code
              description: "Run ripgrep pattern search across the target repository"
              risk_surface: file_access
            - name: resolve_symbol
              description: "Resolve a named constant to its numeric value"
              risk_surface: file_access
            - name: trace_callers
              description: "Walk backward from a function to find its callers"
              risk_surface: file_access
            - name: trace_callees
              description: "Walk forward from a function to find its callees"
